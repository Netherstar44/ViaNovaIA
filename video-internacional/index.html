<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #070b14;
        --navy: #0b1220;
        --gold: #facc15;
        --green: #22c55e;
        --slate: #94a3b8;
        --white: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="47.0"
      data-width="1920"
      data-height="1080"
    >
      <!-- Audio: Master International Voiceover -->
      <audio
        id="audio-voiceover"
        src="assets/audio/voiceover.mp3"
        data-start="0"
        data-duration="45.33"
        data-volume="1"
      ></audio>

      <!-- Audio: Organic Latin Electronic Lounge -->
      <audio
        id="audio-music"
        src="assets/audio/music.mp3"
        data-start="0"
        data-duration="47.0"
        data-volume="0.15"
        data-fade-in="1.0"
        data-fade-out="2.0"
      ></audio>

      <!-- Scene 1: The Hook -->
      <div
        id="s1-hook"
        class="clip"
        data-composition-id="s1-hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2: Multilingual AI Concierge -->
      <div
        id="s2-concierge"
        class="clip"
        data-composition-id="s2-concierge"
        data-composition-src="compositions/02-concierge.html"
        data-start="5.5"
        data-duration="8.0"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3: Immersive 360° Preview -->
      <div
        id="s3-viewer360"
        class="clip"
        data-composition-id="s3-viewer360"
        data-composition-src="compositions/03-viewer360.html"
        data-start="13.5"
        data-duration="9.5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4: Transparent Mobility (Taxi) -->
      <div
        id="s4-mobility"
        class="clip"
        data-composition-id="s4-mobility"
        data-composition-src="compositions/04-mobility.html"
        data-start="23.0"
        data-duration="8.0"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 5: ViaSocial Community -->
      <div
        id="s5-community"
        class="clip"
        data-composition-id="s5-community"
        data-composition-src="compositions/05-community.html"
        data-start="31.0"
        data-duration="6.5"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 6: Outro & Call To Action -->
      <div
        id="s6-closing"
        class="clip"
        data-composition-id="s6-closing"
        data-composition-src="compositions/06-closing.html"
        data-start="37.5"
        data-duration="9.5"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
