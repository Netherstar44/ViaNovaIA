name: Security checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      JWT_SECRET: ci-only-jwt-secret-0123456789-abcdef
      SESSION_SECRET: ci-only-session-secret-0123456789-abcd
      PAYMENT_ENCRYPTION_KEY: ci-only-payment-key-0123456789-abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Security regression tests
        run: npm test

      # Se aceptan las 8 alertas moderadas de exceljs -> archiver -> glob ->
      # minimatch (GHSA-g3hv-75wg-m249): no hay versión compatible que las
      # corrija sin romper la exportación XLSX. El umbral high sigue bloqueando
      # cualquier vulnerabilidad alta o crítica.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python TTS dependencies
        run: python -m pip install -r requirements.txt

      - name: Python TTS security tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Production build
        run: npm run build

      - name: Verify build artifact
        run: test -f dist/index.cjs && test -f dist/public/index.html
