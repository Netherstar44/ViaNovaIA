name: Cloudflare Pages Deployment

on:
  push:
    branches:
      - main
      - Despliegue-vercel
  pull_request:
    branches:
      - main
      - Despliegue-vercel

permissions:
  contents: read
  deployments: write
  statuses: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Verify Cloudflare Secret
        id: check-secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::El secreto CLOUDFLARE_API_TOKEN no está configurado en GitHub Secrets. Agrégalo en Settings > Secrets and variables > Actions para habilitar el despliegue automático desde GitHub."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Cloudflare Pages
        if: steps.check-secrets.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=vianova --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
