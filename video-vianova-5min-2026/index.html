<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #08080a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #08080a;
        color: #f7f4ed;
        font-family: Inter, sans-serif;
      }
      .film-grain {
        position: absolute;
        inset: 0;
        z-index: 90;
        pointer-events: none;
        background-image: url("assets/img/grain.png");
        background-size: 256px 256px;
        opacity: .045;
      }
      .film-vignette {
        position: absolute;
        inset: 0;
        z-index: 91;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 47%, transparent 44%, rgba(0,0,0,.24) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="300"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <audio
        id="audio-master"
        src="assets/audio/master5v.m4a"
        data-start="0"
        data-duration="300"
        data-volume="1"
      ></audio>
      <div
        id="s01"
        data-composition-id="s01"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
