    gsap.set('.panel', { opacity: 0, y: 35, scale: 0.95 });

    gsap.set('.cursor', { opacity: 0, x: 60, y: 50 });
    gsap.set('.ripple', { opacity: 0, scale: 0.2 });

    const tl = gsap.timeline({ paused: true });

    // 0.0s - 0.8s: Ghost tabs enter and collapse
    tl.to('.ghost-tabs', { opacity: 0.35, x: 0, duration: 0.6, ease: 'power2.out' }, 0.1);
    tl.to('.ghost-tabs', { opacity: 0, x: 40, scale: 0.9, duration: 0.6, ease: 'power2.in' }, 0.8);

    // 0.3s - 1.2s: Chat panel springs in
    tl.to('.panel', { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: 'power3.out' }, 0.3);

    // 0.6s: Headline enters
    tl.to('.headline', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 0.6);

    // 1.0s: Cursor enters towards send button
    tl.to('.cursor', { opacity: 1, x: 0, y: 0, duration: 0.8, ease: 'power2.out' }, 1.0);

    // 1.8s: Click action and ripple
    tl.to('.cursor', { scale: 0.85, duration: 0.1, yoyo: true, repeat: 1 }, 1.8);
    tl.to('.ripple', { opacity: 0.7, scale: 1.6, duration: 0.4, ease: 'power2.out' }, 1.8);
    tl.to('.ripple', { opacity: 0, duration: 0.3 }, 2.0);

    // 2.0s: User message sends and pops in
    tl.to('.msg.user', { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: 'back.out(1.5)' }, 2.0);

    // 2.8s: AI response streams in
    tl.to('.msg.ai', { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 2.8);

    tl.to('.plan-row', { opacity: 1, y: 0, duration: 0.3 }, 3.8);
    tl.to('.day-card', { opacity: 1, y: 0, duration: 0.5, stagger: 0.2, ease: 'power2.out' }, 3.9);

    // 4.6s: Mini-map reveals
