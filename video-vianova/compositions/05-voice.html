    window.__timelines = window.__timelines || {};

    gsap.set('.voice-scrim', { opacity: 0 });
    gsap.set('.voice', { opacity: 0, scale: 0.92, y: 15 });
    gsap.set('.transcript', { opacity: 0, y: 10 });
    gsap.set('.msg.ai', { opacity: 0, y: 15 });
    gsap.set('.added-card', { opacity: 0, scale: 0.94, y: 18 });
    gsap.set('.bars i', { scaleY: 0.3, transformOrigin: 'center center' });

    const tl = gsap.timeline({ paused: true });

    // 0.2s: Voice overlay opens
    tl.to('.voice-scrim', { opacity: 0.65, duration: 0.5, ease: 'power2.out' }, 0.2);
    tl.to('.voice', { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: 'back.out(1.5)' }, 0.2);

    // 0.5s - 2.5s: 12 bars oscillate organically
    tl.to('.bars i:nth-child(odd)', { scaleY: 1.3, duration: 0.35, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 0.4);
    tl.to('.bars i:nth-child(even)', { scaleY: 0.7, duration: 0.4, yoyo: true, repeat: 4, ease: 'sine.inOut' }, 0.5);

    // 0.9s: Live transcription reveals
    tl.to('.transcript', { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 0.9);

    // 2.6s: Voice overlay finishes and fades out
    tl.to('.voice', { opacity: 0, scale: 0.96, duration: 0.4, ease: 'power2.in' }, 2.6);
    tl.to('.voice-scrim', { opacity: 0, duration: 0.4 }, 2.6);

    // 3.0s: AI confirmation message
    tl.to('.msg.ai', { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 3.0);

    // 3.4s: Itinerary card added with spring
    tl.to('.added-card', { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: 'back.out(1.6)' }, 3.4);

    // Push camera
    tl.to('#root', { scale: 1.03, transformOrigin: 'center center', duration: 4.5, ease: 'none' }, 0);

    window.__timelines["s5-voice"] = tl;
